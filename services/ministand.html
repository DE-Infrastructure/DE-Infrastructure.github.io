<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../images.ico">
  <title>Mini Stand — Airflow, Gitea, PostgreSQL</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 Mini Stand</h1>
      <p>Airflow · Gitea · PostgreSQL</p>
    </header>

    <!-- Фильтры такие же, но без тэгов (можно оставить только поиск по имени) -->
    <div class="filters-block">
      <input type="text" id="nameFilter" placeholder="🔍 Поиск по имени сервиса..." />
      <select id="tagFilter">
        <option value="">🏷️ Все тэги</option>
      </select>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading">⏳ Загрузка сервисов...</div>

    <!-- Database Section -->
    <div id="dbSection" class="section db-section" style="display:none;">
      <h2>🗄️ Database</h2>
      <div id="dbCards" class="cards-grid"></div>
    </div>

    <!-- User Services Section -->
    <div id="userSection" class="section" style="display:none;">
      <h2>👥 Data Tools</h2>
      <div id="userCards" class="cards-grid"></div>
    </div>

    <!-- Admin Services Section -->
    <div id="adminSection" class="section admin-section" style="display:none;">
      <h2>🔐 Admin Service</h2>
      <div id="adminCards" class="cards-grid"></div>
    </div>

    <!-- Ссылка назад на основную страницу -->
    <div class="section" style="text-align:center; margin-top: 10px;">
      <a href="../index.html" class="card-link">← Вернуться к полному дашборду</a>
    </div>
  </div>

  <script src="./main_ministand.js"></script>
</body>
</html>
